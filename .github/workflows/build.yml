name: Makefile CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Install shellcheck
      run: |
        if ! command -v shellcheck >/dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y shellcheck
        fi

    - name: Run tests
      run: tests/run.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        defconfig:
        - raspberrypi0w
        - raspberrypizero2w
        - raspberrypi4
        - raspberrypi3a
        - raspberrypi5

    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      BR2_DL_DIR: ${{ github.workspace }}/dl

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache buildroot downloads
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/dl
        key: dl-${{ matrix.defconfig }}-${{ hashFiles('aa_wireless_dongle/configs/*_defconfig', 'aa_wireless_dongle/package/**/*.hash', '.gitmodules') }}
        restore-keys: |
          dl-${{ matrix.defconfig }}-
          dl-

    - name: Setup config
      run: make BR2_EXTERNAL=../aa_wireless_dongle/ ${{ matrix.defconfig }}_defconfig
      working-directory: ./buildroot

    - name: Build
      run: make
      working-directory: ./buildroot

    - name: Compress sdcard.img
      run: xz -c sdcard.img > ${{ matrix.defconfig }}-sdcard.img.xz
      working-directory: ./buildroot/output/images

    - uses: actions/upload-artifact@v4
      with:
        name: WirelessAndroidAutoDongle-${{ matrix.defconfig }}
        path: ./buildroot/output/images/${{ matrix.defconfig }}-sdcard.img.xz
  
  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: WirelessAndroidAutoDongle-all
